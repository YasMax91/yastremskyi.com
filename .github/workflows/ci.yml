name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel a superseded run rather than paying for it to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Formatting, lint, types, the contact-endpoint tests, colour contrast,
      # the build, then links, heading order and landmarks over the output.
      # Same command a developer runs locally — a CI that checks something
      # different from the local gate is a CI nobody trusts.
      - name: Verify
        run: npm run verify

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Serve the built site
        run: |
          npx astro preview --port 4330 &
          npx wait-on http://localhost:4330 --timeout 60000

      - name: Audit every route
        run: npm run lighthouse

      # The reports are the evidence behind any performance claim in the README,
      # so they are kept rather than described.
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: docs/evidence/
          retention-days: 30

      # What the gates measured on the commit that is about to be in production,
      # published to the status page. Only from main, and only from a green run:
      # the page's whole claim is that these numbers belong to the deployed
      # commit, so posting a pull request's numbers would make it a lie.
      #
      # `continue-on-error` because this is reporting, not a gate. A status page
      # that cannot be updated is a worse day than a build that goes red over it.
      - name: Publish the gate results to the status page
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.STATUS_INGEST_TOKEN }}
        run: |
          set -uo pipefail
          if [[ -z "${TOKEN}" ]]; then
            echo "no ingest token configured — skipping"
            exit 0
          fi

          routes="$(jq -c '[.results[] | {
            route: .route,
            performance: .scores.performance,
            lcp: (.vitals.LCP | round)
          }]' docs/evidence/lighthouse-summary.json)"

          body="$(jq -nc --arg commit "${GITHUB_SHA:0:7}" --argjson routes "${routes}" \
            '{kind:"gates", commit:$commit, ci:"passing", routes:$routes}')"
          echo "gates: ${body}"

          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            -X POST https://yastremskyi.com/api/status/probe \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "${body}")"
          echo "ingest answered ${code}"
